<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多边形标注工具</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="toolbar">
    <span class="brand">多边形标注</span>
    <button id="btnLoadImage" title="加载背景图片">加载图片</button>
    <button id="btnUndo" title="撤销 (Ctrl+Z)" disabled>撤销</button>
    <button id="btnRedo" title="重做 (Ctrl+Y)" disabled>重做</button>
    <button id="btnDelete" title="删除选中多边形 (Delete)" disabled>删除选中</button>
    <button id="btnClear" title="清空全部标注">清空</button>
    <button id="btnExport" class="primary" title="导出 JSON (Web Worker 序列化)">导出 JSON</button>
    <span class="spacer"></span>
    <span id="status" class="status">就绪</span>
  </header>

  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="hint">
      左键单击添加顶点 · 点击起点或双击/回车闭合多边形 · Esc 取消 · 拖动顶点微调 · Ctrl+Z 撤销
    </div>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" accept="image/*" hidden />

  <script src="js/app.js"></script>
</body>
</html>
